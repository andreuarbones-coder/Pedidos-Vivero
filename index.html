<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vivero - Pedidos</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        vivero: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Ocultar barra de scroll para estética nativa */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        body { -webkit-tap-highlight-color: transparent; }
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-stone-100 text-stone-800 font-sans antialiased">

    <div id="app" class="max-w-md mx-auto bg-stone-50 min-h-screen relative shadow-2xl overflow-hidden flex flex-col">
        
        <!-- Header Independiente (Sin botón de volver) -->
        <header class="bg-vivero-900 text-white p-4 shadow-md z-10 sticky top-0">
            <div class="flex justify-between items-center mb-2">
                <div class="flex items-center">
                    <h1 class="text-2xl font-bold tracking-wide"><i class="fa-solid fa-box-open mr-2"></i>Pedidos</h1>
                </div>
                <button onclick="syncData()" class="p-2 rounded-full hover:bg-vivero-700 transition">
                    <i class="fa-solid fa-rotate" id="sync-icon"></i>
                </button>
            </div>
            <p class="text-vivero-100 text-sm">Registro de stock y encargos</p>
        </header>

        <main class="flex-1 overflow-y-auto p-4 pb-24" id="orders-list">
            <div class="text-center text-stone-400 mt-10" id="empty-state">
                <i class="fa-solid fa-seedling text-4xl mb-3 opacity-50"></i>
                <p>No hay pedidos registrados.</p>
            </div>
            <!-- Las tarjetas se generan dinámicamente aquí -->
        </main>

        <!-- Notificaciones Toast -->
        <div id="toast" class="fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-stone-800 text-white px-4 py-2 rounded-lg shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50 flex items-center w-max max-w-[90%]">
            <i id="toast-icon" class="mr-2"></i>
            <span id="toast-msg">Mensaje</span>
        </div>

        <!-- Botón Flotante -->
        <button onclick="openModal()" class="absolute bottom-6 right-6 w-14 h-14 bg-vivero-500 text-white rounded-full shadow-lg shadow-vivero-500/50 flex justify-center items-center text-2xl hover:bg-vivero-600 hover:scale-105 transition transform active:scale-95 z-20">
            <i class="fa-solid fa-plus"></i>
        </button>

        <!-- Modal Formulario -->
        <div id="order-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex-col justify-end max-w-md mx-auto">
            <div class="bg-white rounded-t-3xl p-6 slide-up w-full max-h-[90vh] overflow-y-auto">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-stone-800" id="modal-title">Nuevo Pedido</h2>
                    <button onclick="closeModal()" class="text-stone-400 hover:text-stone-600 text-2xl leading-none">&times;</button>
                </div>
                
                <form id="order-form" onsubmit="saveOrder(event)" class="space-y-5">
                    <input type="hidden" id="order-fila">
                    
                    <div>
                        <label class="block text-sm font-medium text-stone-600 mb-1">ESPECIE</label>
                        <input type="text" id="input-especie" required class="w-full border-2 border-stone-200 rounded-xl p-3 focus:outline-none focus:border-vivero-500 bg-stone-50 text-lg font-medium" placeholder="Ej: Limonero 4 estaciones">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-stone-600 mb-1">CANTIDAD</label>
                            <input type="number" id="input-cantidad" required min="1" class="w-full border-2 border-stone-200 rounded-xl p-3 focus:outline-none focus:border-vivero-500 bg-stone-50 text-center text-xl font-bold" placeholder="0">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-stone-600 mb-1">TAMAÑO / PRESENTACIÓN</label>
                            <input type="text" id="input-tamano" class="w-full border-2 border-stone-200 rounded-xl p-3 focus:outline-none focus:border-vivero-500 bg-stone-50" placeholder="M12, 3L, Plantín...">
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-vivero-900 text-white font-bold py-4 rounded-xl mt-6 hover:bg-vivero-700 transition active:scale-95 shadow-md">
                        Guardar Registro
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // ¡IMPORTANTE! PEGAR AQUÍ LA NUEVA URL DE GOOGLE APPS SCRIPT
        const GOOGLE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby3biJtYRYCpo2-HYfVYK6arNPGG67tpoeOGoBzhNTEFmh4IPHZbpW83680h8BPYXY/exec"; 

        let orders = [];

        window.onload = () => {
            loadOrders();
        };

        async function loadOrders() {
            showToast("Cargando base de datos...", "fa-spinner fa-spin");
            
            if (GOOGLE_APPS_SCRIPT_URL) {
                try {
                    const response = await fetch(GOOGLE_APPS_SCRIPT_URL);
                    orders = await response.json();
                    showToast("Sincronizado", "fa-check", 2000);
                } catch (error) {
                    showToast("Error de conexión, usando datos locales", "fa-triangle-exclamation", 3000);
                    loadLocalOrders();
                }
            } else {
                loadLocalOrders();
                showToast("Modo prueba (Falta URL de Sheets)", "fa-mobile-screen", 3000);
            }
            renderOrders();
        }

        function loadLocalOrders() {
            const stored = localStorage.getItem('vivero_pedidos');
            if (stored) orders = JSON.parse(stored);
        }

        function saveLocalOrders() {
            localStorage.setItem('vivero_pedidos', JSON.stringify(orders));
        }

        async function syncData() {
            const icon = document.getElementById('sync-icon');
            icon.classList.add('fa-spin');
            await loadOrders();
            setTimeout(() => icon.classList.remove('fa-spin'), 500);
        }

        function renderOrders() {
            const container = document.getElementById('orders-list');
            const emptyState = document.getElementById('empty-state');
            
            // Limpiar tarjetas existentes (excepto el empty state)
            const cards = container.querySelectorAll('.order-card');
            cards.forEach(c => c.remove());

            if (orders.length === 0) {
                emptyState.style.display = 'block';
                return;
            }
            emptyState.style.display = 'none';

            orders.forEach(order => {
                const card = document.createElement('div');
                card.className = 'order-card bg-white p-4 rounded-2xl shadow-sm border border-stone-200 mb-3 flex items-center justify-between transition-all active:bg-stone-50';
                
                // Leemos usando los mismos encabezados del Excel
                const especie = order['ESPECIE'] || 'Sin nombre';
                const cantidad = order['CANTIDAD'] || '0';
                const tamano = order['TAMAÑO / PRESENTACIÓN'] || '-';
                
                card.innerHTML = `
                    <div class="flex-1 pr-4">
                        <h3 class="font-bold text-lg text-stone-800 leading-tight mb-1">${especie}</h3>
                        <div class="flex items-center text-sm font-medium text-stone-500">
                            <i class="fa-solid fa-ruler-combined mr-1.5 opacity-70"></i> ${tamano}
                        </div>
                    </div>
                    <div class="bg-vivero-100 text-vivero-900 px-4 py-2 rounded-xl flex flex-col items-center justify-center min-w-[70px]">
                        <span class="text-xs uppercase font-bold opacity-70 mb-0.5">Cant.</span>
                        <span class="text-2xl font-black leading-none">${cantidad}</span>
                    </div>
                `;
                
                // Si la fila viene del Sheets (tiene el atributo _fila), la hacemos editable
                if(order._fila) {
                    card.onclick = () => editOrder(order);
                }
                
                container.appendChild(card);
            });
        }

        function openModal() {
            document.getElementById('order-modal').classList.remove('hidden');
            document.getElementById('order-modal').classList.add('flex');
            
            document.getElementById('order-fila').value = '';
            document.getElementById('order-form').reset();
            document.getElementById('modal-title').innerText = 'Nuevo Pedido';
            
            setTimeout(() => document.getElementById('input-especie').focus(), 100);
        }

        function closeModal() {
            document.getElementById('order-modal').classList.add('hidden');
            document.getElementById('order-modal').classList.remove('flex');
        }

        function editOrder(order) {
            document.getElementById('order-fila').value = order._fila;
            document.getElementById('input-especie').value = order['ESPECIE'] || '';
            document.getElementById('input-cantidad').value = order['CANTIDAD'] || '';
            document.getElementById('input-tamano').value = order['TAMAÑO / PRESENTACIÓN'] || '';
            
            document.getElementById('modal-title').innerText = 'Editar Pedido';
            
            document.getElementById('order-modal').classList.remove('hidden');
            document.getElementById('order-modal').classList.add('flex');
        }

        async function saveOrder(e) {
            e.preventDefault();
            
            // Creamos un objeto donde las claves coinciden EXACTAMENTE con tu Excel
            const orderData = {
                'ESPECIE': document.getElementById('input-especie').value,
                'CANTIDAD': document.getElementById('input-cantidad').value,
                'TAMAÑO / PRESENTACIÓN': document.getElementById('input-tamano').value
            };

            const fila = document.getElementById('order-fila').value;
            if (fila) {
                orderData._fila = fila; 
            }

            // Actualización visual en la app
            if (!fila) {
                orders.unshift(orderData); // Lo pone primero en la lista visualmente
            } else {
                const index = orders.findIndex(o => o._fila == fila);
                if(index > -1) orders[index] = orderData;
            }

            closeModal();
            renderOrders();
            
            // Envío a Google Sheets
            if (GOOGLE_APPS_SCRIPT_URL) {
                showToast("Guardando en la planilla...", "fa-spinner fa-spin");
                try {
                    await fetch(GOOGLE_APPS_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify(orderData),
                        // Evita problemas de CORS
                        headers: {
                            'Content-Type': 'text/plain;charset=utf-8',
                        }
                    });
                    
                    // Recargamos silenciosamente para tener los números de fila actualizados
                    await loadOrders(); 
                    showToast("Planilla actualizada", "fa-check", 2000);
                } catch(error) {
                    console.error("Error guardando:", error);
                    showToast("Error al conectar con Sheets", "fa-xmark", 3000);
                }
            } else {
                saveLocalOrders();
                showToast("Guardado en el teléfono", "fa-check", 2000);
            }
        }

        function showToast(msg, iconClass, duration = null) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            document.getElementById('toast-icon').className = `fa-solid ${iconClass}`;
            
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            
            if(window.toastTimer) clearTimeout(window.toastTimer);
            
            if (duration) {
                window.toastTimer = setTimeout(() => {
                    toast.classList.remove('opacity-100');
                    toast.classList.add('opacity-0');
                }, duration);
            }
        }
    </script>
</body>
</html>
